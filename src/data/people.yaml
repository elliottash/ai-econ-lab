  # ---- Lab manager ----
  - slug: julia-coll-cardona
    name: Julia Coll Cardona
    role: Lab Manager
    group: manager
    photo: /assets/people/julia-coll-cardona.jpg
    bio: >-
      Julia Coll Cardona is the Administrative Assistant at the Center for Law
      & Economics, supporting Prof. Elliott Ash, Prof. Stefan Bechtold, and
      Prof. Alexander Stremitzer. She holds a Master in Corporate
      Communications, Protocol and Events from the University of Barcelona.

  # ---- Faculty affiliates ----
  - slug: sergio-galletta
    name: Sergio Galletta
    role: Faculty Affiliate, Sapienza University of Rome
    group: affiliate
    url: https://sergio-galletta.com/
    bio: >-
      Associate Professor of Public Economics at Sapienza University of Rome.
      Empirical public economics and political economy with machine learning
      methods; frequent collaborator on AI, media, and democracy projects.

  - slug: david-yanagizawa-drott
    name: David Yanagizawa-Drott
    role: Faculty Affiliate, University of Zurich
    group: affiliate
    url: https://yanagizawadrott.com/
    bio: >-
      Professor of Development and Emerging Markets at the University of
      Zurich. Co-organizer of the Zurich Workshop in AI + Economics and
      co-chair of the Project for AI Evidence at J-PAL.

  - slug: joachim-voth
    name: Hans-Joachim Voth
    role: Faculty Affiliate, University of Zurich
    group: affiliate
    url: https://www.jvoth.com/
    bio: >-
      UBS Foundation Professor of Economics at the University of Zurich.
      Long-run growth, cultural economics, and economic history.

