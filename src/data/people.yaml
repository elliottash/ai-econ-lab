  # ---- PhD students ----
  - slug: maurizia-di-buono
    name: Maurizia Di Buono
    role: PhD Student
    group: phd
    photo: /assets/people/maurizia-di-buono.jpg
    bio: >-
      Maurizia Di Buono is a PhD student at the Center for Law & Economics.
      She holds a Master's in Economics and Econometrics from the University
      of Bologna and a Bachelor's in Economics from the University of Naples.

  - slug: yu-fan
    name: Yu Fan
    role: PhD Student
    group: phd
    photo: /assets/people/yu-fan.jpg
    bio: >-
      Yu Fan is a Ph.D. student at the chair of Prof. Elliott Ash. He works on
      applied and legal NLP, agentic AI, and machine learning, with further
      interests in computational social science and software law.

  - slug: benjamin-kohler
    name: Benjamin Kohler
    role: PhD Student
    group: phd
    photo: /assets/people/benjamin-kohler.jpg
    bio: >-
      Benjamin Kohler is a Ph.D. student at the chair of Prof. Elliott Ash.
      He holds an M.Sc. in Social Data Science from the University of
      Copenhagen and a B.Sc. in Economics from the University of Mannheim,
      and spent two years as a predoctoral research assistant at Mannheim
      and Copenhagen.

  - slug: jingwei-ni
    name: Jingwei Ni
    role: PhD Student
    group: phd
    url: https://edisonni-hku.github.io/
    photo: /assets/people/jingwei-ni.jpg
    bio: >-
      Jingwei Ni is a Ph.D. student in the group of Prof. Elliott Ash,
      co-supervised by Prof. Markus Leippold (UZH) and Prof. Mrinmaya Sachan
      (ETH Zurich). He studied computer science at the University of Hong
      Kong and data science and machine learning at University College
      London. His research covers AI applications — fact-checking, scientific
      communication, AI for social good — and causal NLP.

  - slug: gianmarco-torchetti
    name: Gianmarco Torchetti
    role: PhD Student
    group: phd
    photo: /assets/people/gianmarco-torchetti.jpg
    bio: >-
      Gianmarco Torchetti is a Ph.D. student at the chair of Prof. Elliott
      Ash. He holds an M.Sc. in Economics and Econometrics from the University
      of Bologna and a B.Sc. from the University of Rome Tor Vergata, and
      worked as a predoctoral research assistant at Harvard Business School.
      He is interested in combining machine learning and causal inference to
      answer empirical questions in political economy, development, culture,
      and innovation.

  - slug: lehan-zhang
    name: Lehan Zhang
    role: PhD Student
    group: phd
    url: https://www.lehanzhang.com/
    photo: /assets/people/lehan-zhang.jpg
    bio: >-
      Lehan Zhang is a Ph.D. student at the chair of Prof. Elliott Ash. She
      holds degrees in Data Science and Decisions and in Economics from the
      University of New South Wales and worked at the UNSW Resilient
      Democracy Lab. She applies NLP methods and causal inference to
      political economy, culture and identity, and media.

  - slug: david-zollikofer
    name: David Zollikofer
    role: PhD Student
    group: phd
    url: https://www.davidrzs.com
    photo: /assets/people/david-zollikofer.jpg
    bio: >-
      David Zollikofer is a Ph.D. student at Elliott Ash's chair at ETH
      Zurich. He holds a master's degree in computer science with a focus on
      theoretical computer science and machine learning and is a member of
      the Swiss Study Foundation. Prior to his doctoral studies he designed
      algorithms in industry and conducted research in Himabindu
      Lakkaraju's group at Harvard.

  - slug: andrin-gehrig
    name: Andrin Gehrig
    role: PhD Student
    group: phd

  - slug: yang-tian
    name: Yang Tian
    role: PhD Student
    group: phd

