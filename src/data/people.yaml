      Matthew Bonci is a Scientific Assistant in the research team of Prof.
      Elliott Ash. He holds a Master's in Data Analytics and Research Methods
      from the Harris School of Public Policy (University of Chicago) and a
      B.S. in Mathematics and Economic Analysis from Binghamton University.

  - slug: wei-pin
    name: Wei Pin
    role: Scientific Assistant
    group: assistant
    photo: /assets/people/wei-pin.jpg
    bio: >-
      Wei Pin is a Scientific Assistant in the research team of Prof. Elliott
      Ash. He holds a Bachelor's in Economics and Finance from the University
      of Liverpool and Xi'an Jiaotong.

  - slug: pranav-garg
    name: Pranav Garg
    role: Scientific Assistant
    group: assistant
    photo: /assets/people/pranav-garg.jpg
    bio: >-
      Pranav Garg is a Scientific Assistant in the research team of Prof.
      Elliott Ash. He holds a Bachelor's in Economics with a Minor in
      Mathematics from the Nanyang Technological University of Singapore.

  - slug: dan-goettlich
