server {
    listen 80;
    server_name ai-econ-lab.com www.ai-econ-lab.com www.ai-econ-lab.org;
    return 301 https://ai-econ-lab.org$request_uri;
}
server {
    listen 80;
    server_name ai-econ-lab.org;
    root /opt/ai-econ-lab/site/dist;
    index index.html;
    absolute_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /chat { return 302 https://chat.ai-econ-lab.org/$is_args$args; }
    location ^~ /chat/ { rewrite ^/chat/(.*)$ https://chat.ai-econ-lab.org/$1 redirect; }

    location = /kb { return 301 /kb/$is_args$args; }
    location ^~ /kb/ {
        auth_basic "Lab KB";
        auth_basic_user_file /etc/nginx/.htpasswd-zrh-kb;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # Course pages and downloads live on the course domain.
    location = /summer-school { return 301 https://zrh-ai-econ.com/$is_args$args; }
    location = /summer-school/ { return 301 https://zrh-ai-econ.com/$is_args$args; }
    location = /summer-school/2026 { return 301 https://zrh-ai-econ.com/$is_args$args; }
    location = /summer-school/2026/ { return 301 https://zrh-ai-econ.com/$is_args$args; }
    location = /summer-school/2026/chat { return 301 https://zrh-ai-econ.com/chat$is_args$args; }
    location ^~ /summer-school/2026/chat/ { rewrite ^/summer-school/2026/chat/(.*)$ https://zrh-ai-econ.com/chat/$1 permanent; }
    location ~ ^/(slides|notebooks|assignments)(/|$) { return 301 https://zrh-ai-econ.com$request_uri; }

    location / { try_files $uri $uri/ =404; }
    location ~ (^|/)\. { return 404; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.(?:css|svg|pdf)$ { add_header Cache-Control "public, max-age=300"; try_files $uri =404; }
}
